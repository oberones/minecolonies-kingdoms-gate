name: Test and release

on:
  pull_request:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
  GRADLE_FLAGS: --no-daemon --console=plain

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download checksum-pinned dependencies
        run: python3 tools/import_reference.py --download
      - name: Unit tests
        run: make test

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+\.)*[0-9A-Za-z-]+)?$'
          if [[ ! "$version" =~ $pattern ]]; then
            echo 'Expected a version tag such as 0.3.0, v0.3.0, or 0.3.0-rc.1.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo 'Release tags must point to commits contained in main.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download checksum-pinned dependencies
        run: python3 tools/import_reference.py --download
      - name: Build tagged version and run unit tests
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ steps.version.outputs.version }}
        run: make build
      - name: Publish mod to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          jar="build/libs/minecolonies-cult-${RELEASE_VERSION}.jar"
          test -s "$jar"
          options=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$jar" --verify-tag \
            --title "Kingdom's Gate ${RELEASE_VERSION}" --generate-notes "${options[@]}"
